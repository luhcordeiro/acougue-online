version: '3.8'

services:
  # Banco de dados MySQL
  db:
    image: mysql:8.0
    container_name: acougue_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: acougue_online
      MYSQL_USER: acougue_user
      MYSQL_PASSWORD: acougue_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação Web
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acougue_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: mysql://acougue_user:acougue_password@db:3306/acougue_online
      
      # JWT Secret (ALTERAR EM PRODUÇÃO!)
      JWT_SECRET: change-this-secret-in-production-use-random-string
      
      # OAuth (usar valores reais em produção)
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-https://api.manus.im}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-https://login.manus.im}
      VITE_APP_ID: ${VITE_APP_ID:-your-app-id}
      
      # Owner info (configurar com dados reais)
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-owner-openid}
      OWNER_NAME: ${OWNER_NAME:-Admin}
      
      # App config
      VITE_APP_TITLE: "Açougue Online - Sistema de Pedidos"
      VITE_APP_LOGO: ""
      
      # Forge API (opcional, para recursos avançados)
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      
      # Analytics (opcional)
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
      
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./drizzle:/app/drizzle

volumes:
  db_data:
    driver: local
